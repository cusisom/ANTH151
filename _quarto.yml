project:
  type: website

website:
  title: "ANTH151"
  site-url: "https://github.io"
  repo-url: "https://github.com"
  sidebar:
    style: "floating"       # FIXED: Changing from 'docked' allows the sidebar to collapse
    collapse-level: 1       # Adds toggle capabilities to individual category headers
    contents:
      - href: index.qmd
        text: Home
        
      - section: "Unit 1: Human Evolution"
        collapse-level: 1
        contents:
          - href: "Unit 1/Evolution.qmd"
            text: "Ch 1. Evolution (S)"
          - href: "Unit 1/Primates.qmd"
            text: "Ch 2. Humans as Primates (A)"
        
      - section: "Unit 2: Ancient Migrations"
        collapse-level: 1
        contents:
          - href: "Unit 2/Temporal.qmd"
            text: "Ch 7. Temporal Context (A)"
          - href: "Unit 2/Climate.qmd"
            text: "Ch. 8 Environmental Context (A)"
          - href: "Unit 2/North_America.qmd"
            text: "Ch 10. Peopling of the Americas (A)"
        
      - section: "Unit 3: Civilization"
        collapse-level: 1
        contents:
          - href: index.qmd
            text: "Unit 3 Coming Soon"

format:
  html:
    bibliography: references.bib
    include-in-header: header.html
    tbl-cap-location: bottom
    theme:
      - minty
    css: styles.css
    from: markdown+emoji
    toc: true
    toc-title: Contents
    toc-location: left
    grid:                     # FIXED: Explicit pixel constraints to align elements smoothly
      sidebar-width: 260px
      margin-width: 260px
      body-width: 900px
      gutter-width: 20px


